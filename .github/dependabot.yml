version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels: [dependencies]
    commit-message:
      prefix: chore(deps)
    groups:
      github-actions:
        patterns: ['*']
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels: [dependencies]
    commit-message:
      prefix: chore(deps)
    # pytest-homeassistant is deliberately not ignored: bumping it moves the tests
    # to each new Home Assistant release (it pins the matching homeassistant).

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    labels: [dependencies]
    commit-message:
      prefix: chore(deps)
    groups:
      frontend:
        patterns: ['*']
        update-types: [minor, patch]
