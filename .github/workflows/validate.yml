name: Validate

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  schedule:
    - cron: 0 0 * * *
      timezone: Australia/Brisbane
  workflow_dispatch:

permissions: {}

jobs:
  hassfest: # https://developers.home-assistant.io/blog/2020/04/16/hassfest
    name: Hassfest
    runs-on: ${{ fromJSON(vars.RUNNER_LABELS || '"ubuntu-latest"') }}
    permissions:
      contents: read # private repository: checkout needs read access
    steps:
      - name: Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run hassfest validation
        uses: home-assistant/actions/hassfest@86d4564712fa02543c808e3a693dd04f9d3f8361 # master

  hacs: # https://github.com/hacs/action
    name: HACS
    # HACS reads manifest.json/hacs.json the way it does for public repositories and
    # cannot validate (or install) a private repository; it runs once the repo is public.
    if: ${{ !github.event.repository.private }}
    runs-on: ${{ fromJSON(vars.RUNNER_LABELS || '"ubuntu-latest"') }}
    permissions:
      contents: read
    steps:
      - name: Run HACS validation
        uses: hacs/action@d556e736723344f83838d08488c983a15381059a # 22.5.0
        with:
          category: integration
          # Remove this 'ignore' key when you have added brand images for your custom integration to https://github.com/home-assistant/brands
          ignore: brands

  release-zip:
    name: Release zip
    runs-on: ${{ fromJSON(vars.RUNNER_LABELS || '"ubuntu-latest"') }}
    permissions:
      contents: read
    steps:
      - name: Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build twice and compare
        run: |
          # The script refuses to write a zip with a broken layout; building twice
          # proves the same commit always gives the same bytes.
          VERSION=$(jq -r '.version' custom_components/bom_australia/manifest.json)
          SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
          export SOURCE_DATE_EPOCH
          python3 script/build_release_zip.py --output-dir dist/a --version "v${VERSION}"
          python3 script/build_release_zip.py --output-dir dist/b --version "v${VERSION}"
          cmp dist/a/bom_australia.zip dist/b/bom_australia.zip
          (cd dist/a && sha256sum -c SHA256SUMS)

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
