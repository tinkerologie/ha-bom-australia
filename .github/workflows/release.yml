name: Release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - custom_components/bom_australia/manifest.json

permissions:
  contents: read # jobs request only what they need

# One release run at a time, never cancelled: the tag comes from manifest.json
# inside the job, so runs are serialised as a whole. A run must not delete or
# publish a draft another run is still filling.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    name: Build and attest
    runs-on: ubuntu-latest
    permissions:
      contents: read # check out the release commit
      id-token: write # mint the OIDC token that signs the attestation
      attestations: write # store the build provenance attestation
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      release: ${{ steps.tag_check.outputs.release }}
    steps:
      - name: Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Extract version from manifest
        id: version
        run: |
          VERSION="$(jq -r '.version' custom_components/bom_australia/manifest.json)"
          if [[ -z "$VERSION" || "$VERSION" == "null" ]]; then
            echo "::error::manifest.json has no version."
            exit 1
          fi
          # Home Assistant versioning: YEAR.MONTH.PATCH, with an optional pre-release
          # suffix (2026.11.0, 2026.11.1, 2026.11.0b0, 2026.11.0rc1).
          if [[ ! "$VERSION" =~ ^[0-9]{4}\.[0-9]{1,2}\.[0-9]+((a|b|rc)[0-9]+)?$ ]]; then
            echo "::error::Manifest version '$VERSION' does not match YYYY.M.PATCH."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$VERSION" =~ (a|b|rc)[0-9]+$ ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Decide whether to release
        id: tag_check
        env:
          TAG: ${{ steps.version.outputs.tag }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          if [[ "$PRERELEASE" == "true" ]]; then
            echo "::notice::$TAG is a pre-release; no GitHub release is created."
            echo "release=false" >> "$GITHUB_OUTPUT"
          elif git ls-remote --tags origin "refs/tags/$TAG" | grep -q .; then
            echo "::notice::$TAG already exists; nothing to release."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build release zip
        if: steps.tag_check.outputs.release == 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          # Timestamps come from the release commit, so the tag rebuilds byte-identically.
          SOURCE_DATE_EPOCH=$(git log -1 --format=%ct "$GITHUB_SHA")
          export SOURCE_DATE_EPOCH
          python3 script/build_release_zip.py --output-dir dist --version "$TAG"

      - name: Extract release notes from the changelog
        if: steps.tag_check.outputs.release == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
          REPOSITORY: ${{ github.repository }}
        run: |
          mkdir -p release-notes
          FOOTER="See [CHANGELOG.md](https://github.com/${REPOSITORY}/blob/${TAG}/CHANGELOG.md) for the full changelog."

          emit_notes() {
            echo "----- release notes -----"
            cat "$1"
            echo "-------------------------"
            cp "$1" release-notes/RELEASE_NOTES.md
          }

          fallback_notes() {
            {
              echo "Release ${TAG}"
              echo
              echo "---"
              echo
              echo "$FOOTER"
            } > /tmp/release_notes.md
            emit_notes /tmp/release_notes.md
          }

          if [[ ! -f CHANGELOG.md ]]; then
            fallback_notes
            exit 0
          fi

          # Normalize a dotted version by stripping leading zeros from each
          # segment, so the manifest version (2026.6.1) matches zero-padded
          # changelog headings.
          norm() {
            awk -F. -v OFS=. '{ for (i = 1; i <= NF; i++) $i += 0; print }' <<< "$1"
          }

          target="$(norm "$VERSION")"

          # Locate the changelog section for this release: headings look like
          # "## [2026.06.01] - 2026-06-13". Prefer the section matching the
          # manifest version; fall back to the first versioned section.
          start="" end="" first_start="" first_end=""
          while IFS=: read -r lineno text; do
            if [[ -n "$start" && -z "$end" && "$lineno" -gt "$start" ]]; then
              end="$lineno"
            fi
            if [[ -n "$first_start" && -z "$first_end" && "$lineno" -gt "$first_start" ]]; then
              first_end="$lineno"
            fi
            ver="$(sed -n 's/^## \[\([0-9][0-9.]*\)\].*/\1/p' <<< "$text")"
            [[ -z "$ver" ]] && continue
            [[ -z "$first_start" ]] && first_start="$lineno"
            if [[ -z "$start" && "$(norm "$ver")" == "$target" ]]; then
              start="$lineno"
            fi
          done < <(grep -n '^## \[' CHANGELOG.md)

          if [[ -z "$start" ]]; then
            echo "No changelog section found for version ${VERSION}; falling back to the first versioned section."
            start="$first_start"
            end="$first_end"
          fi

          if [[ -z "$start" ]]; then
            echo "No versioned changelog section found at all."
            fallback_notes
            exit 0
          fi

          if [[ -n "$end" ]]; then
            sed -n "$((start + 1)),$((end - 1))p" CHANGELOG.md > /tmp/section.md
          else
            sed -n "$((start + 1)),\$p" CHANGELOG.md > /tmp/section.md
          fi

          # Trim leading and trailing blank lines
          awk 'NF { seen = 1 } seen' /tmp/section.md | tac | awk 'NF { seen = 1 } seen' | tac > /tmp/release_notes.md

          if [[ ! -s /tmp/release_notes.md ]]; then
            echo "Matched changelog section is empty."
            fallback_notes
            exit 0
          fi

          {
            echo
            echo "---"
            echo
            echo "$FOOTER"
          } >> /tmp/release_notes.md

          emit_notes /tmp/release_notes.md

      - name: Attest build provenance
        if: steps.tag_check.outputs.release == 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/bom_australia.zip

      - name: Upload release assets
        if: steps.tag_check.outputs.release == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: |
            dist/
            release-notes/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish
    needs: build
    if: needs.build.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the draft, upload assets, publish the release and tag
      attestations: read # verify the attestation before publishing
    steps:
      - name: Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download release assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: assets

      - name: Verify checksum and provenance
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          (cd assets/dist && sha256sum -c SHA256SUMS)
          # The same command the README gives users, pinned to this workflow.
          gh attestation verify assets/dist/bom_australia.zip --repo "$REPO" \
            --signer-workflow "$REPO/.github/workflows/release.yml"

      - name: Create draft release with assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          # A rerun after a failed publish finds the earlier run's draft for this
          # tag (the tag itself only exists once a release is published): delete it
          # so the rerun starts from one clean draft.
          if [ "$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null)" = "true" ]; then
            gh release delete "$TAG" --yes
          fi
          # Immutable releases lock assets on publish, so upload to a draft first.
          gh release create "$TAG" \
            --draft \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --notes-file assets/release-notes/RELEASE_NOTES.md \
            assets/dist/bom_australia.zip \
            assets/dist/SHA256SUMS \
            CHANGELOG.md

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.build.outputs.tag }}
        run: gh release edit "$TAG" --draft=false

      - name: Verify the immutable release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          # GitHub creates the release attestation shortly after publication, so
          # retry for about a minute. A release published without immutability never
          # gets one, so the step fails and the setting can't lapse unnoticed.
          for attempt in $(seq 1 12); do
            if gh release verify "$TAG"; then
              break
            fi
            if [ "$attempt" -eq 12 ]; then
              echo "::error::No release attestation for $TAG. Is release immutability enabled?"
              exit 1
            fi
            echo "Release attestation not available yet (attempt $attempt/12); retrying in 5 seconds."
            sleep 5
          done
          gh release verify-asset "$TAG" assets/dist/bom_australia.zip
